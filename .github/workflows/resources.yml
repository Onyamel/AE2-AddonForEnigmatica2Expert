name: Проверка ресурсов
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  resources:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.11'
      - name: Проверка JSON и локализаций
        run: python tools/validate_resources.py
      - name: Проверка синтаксиса Python
        run: python -m compileall -q tools
